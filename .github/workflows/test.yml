name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[test]' 'build>=1,<2' 'twine>=5,<7'
      - run: python -m pytest
      - run: python -m compileall -q prompits-lite phemacast-lite demos/data-agent-network-demo
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: data-agent-network-demo --help
