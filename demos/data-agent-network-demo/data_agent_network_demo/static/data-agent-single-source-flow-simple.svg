<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">A simple Data Agent flow coordinated by Plaza</title>
  <desc id="flow-desc">Two-stage flow chart. First, Data User asks for source advice through Plaza, Data Consultant recommends YFinance from catalog documentation, and the recommendation returns through Plaza to Data User. Second, Data User calls YFinance through Plaza, YFinance executes the provider fetch, and the result returns through Plaza to Data User. No provider data passes through Data Consultant.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#10251f" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#f5f5ef"/>
  <rect x="0" y="0" width="1600" height="18" fill="#b7e53b"/>

  <text x="70" y="82" fill="#111b18" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">A simple Data Agent flow</text>
  <text x="70" y="130" fill="#53605b" font-family="Arial, Helvetica, sans-serif" font-size="24">Choose a source first. Fetch data second. Keep ownership visible.</text>

  <rect x="260" y="160" width="1080" height="90" rx="22" fill="#111b18"/>
  <circle cx="315" cy="205" r="20" fill="#b7e53b"/>
  <circle cx="315" cy="205" r="7" fill="#111b18"/>
  <text x="354" y="195" fill="#b7e53b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">CENTRAL PLAZA</text>
  <text x="354" y="226" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24">agents register once · every cross-agent handoff passes through Plaza</text>

  <text x="70" y="307" fill="#168b7c" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="2">STAGE 1  ·  CHOOSE A SOURCE</text>
  <rect x="54" y="325" width="1492" height="230" rx="28" fill="#edf8f5"/>

  <g filter="url(#shadow)">
    <rect x="70" y="345" width="360" height="190" rx="22" fill="#ffffff"/>
    <rect x="620" y="345" width="360" height="190" rx="22" fill="#ffffff"/>
    <rect x="1170" y="345" width="360" height="190" rx="22" fill="#ffffff"/>
  </g>

  <rect x="70" y="345" width="360" height="9" rx="5" fill="#b7e53b"/>
  <rect x="620" y="345" width="360" height="9" rx="5" fill="#29b7a5"/>
  <rect x="1170" y="345" width="360" height="9" rx="5" fill="#b7e53b"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="112" cy="407" r="25" fill="#ecf7c9"/>
    <text x="112" y="415" fill="#48600d" font-size="18" font-weight="700" text-anchor="middle">DU</text>
    <text x="153" y="402" fill="#111b18" font-size="27" font-weight="700">Data User</text>
    <text x="153" y="438" fill="#394640" font-size="23">asks for source advice</text>
    <rect x="101" y="468" width="298" height="44" rx="12" fill="#f2f7e4"/>
    <text x="250" y="496" fill="#48600d" font-size="17" font-weight="700" text-anchor="middle">describes the data need</text>

    <circle cx="662" cy="407" r="25" fill="#daf4ef"/>
    <text x="662" y="415" fill="#0d7366" font-size="18" font-weight="700" text-anchor="middle">DC</text>
    <text x="703" y="402" fill="#111b18" font-size="27" font-weight="700">Data Consultant</text>
    <text x="703" y="438" fill="#394640" font-size="23">recommends YFinance</text>
    <rect x="651" y="468" width="298" height="44" rx="12" fill="#e7f7f3"/>
    <text x="800" y="496" fill="#0d7366" font-size="17" font-weight="700" text-anchor="middle">catalog documentation only</text>

    <circle cx="1212" cy="407" r="25" fill="#ecf7c9"/>
    <text x="1212" y="415" fill="#48600d" font-size="18" font-weight="700" text-anchor="middle">DU</text>
    <text x="1253" y="402" fill="#111b18" font-size="27" font-weight="700">Data User</text>
    <text x="1253" y="438" fill="#394640" font-size="23">selects YFinance</text>
    <rect x="1201" y="468" width="298" height="44" rx="12" fill="#f2f7e4"/>
    <text x="1350" y="496" fill="#48600d" font-size="17" font-weight="700" text-anchor="middle">owns the source decision</text>

    <line x1="430" y1="440" x2="470" y2="440" stroke="#111b18" stroke-width="4"/>
    <rect x="470" y="416" width="110" height="48" rx="24" fill="#111b18"/>
    <text x="525" y="446" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">via Plaza</text>
    <path d="M580 433 H600 V423 L616 440 L600 457 V447 H580 Z" fill="#111b18"/>

    <line x1="980" y1="440" x2="1020" y2="440" stroke="#111b18" stroke-width="4"/>
    <rect x="1020" y="416" width="110" height="48" rx="24" fill="#111b18"/>
    <text x="1075" y="446" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">via Plaza</text>
    <path d="M1130 433 H1150 V423 L1166 440 L1150 457 V447 H1130 Z" fill="#111b18"/>
  </g>

  <text x="70" y="608" fill="#1d56c7" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="2">STAGE 2  ·  GET THE DATA</text>
  <rect x="54" y="626" width="1492" height="230" rx="28" fill="#eef2fd"/>

  <g filter="url(#shadow)">
    <rect x="70" y="646" width="360" height="190" rx="22" fill="#ffffff"/>
    <rect x="620" y="646" width="360" height="190" rx="22" fill="#ffffff"/>
    <rect x="1170" y="646" width="360" height="190" rx="22" fill="#ffffff"/>
  </g>

  <rect x="70" y="646" width="360" height="9" rx="5" fill="#b7e53b"/>
  <rect x="620" y="646" width="360" height="9" rx="5" fill="#2d6df6"/>
  <rect x="1170" y="646" width="360" height="9" rx="5" fill="#111b18"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="112" cy="708" r="25" fill="#ecf7c9"/>
    <text x="112" y="716" fill="#48600d" font-size="18" font-weight="700" text-anchor="middle">DU</text>
    <text x="153" y="703" fill="#111b18" font-size="27" font-weight="700">Data User</text>
    <text x="153" y="739" fill="#394640" font-size="23">calls the selected source</text>
    <rect x="101" y="769" width="298" height="44" rx="12" fill="#f2f7e4"/>
    <text x="250" y="797" fill="#48600d" font-size="17" font-weight="700" text-anchor="middle">remains the caller</text>

    <circle cx="662" cy="708" r="25" fill="#e2eaff"/>
    <text x="662" y="716" fill="#1d56c7" font-size="18" font-weight="700" text-anchor="middle">YF</text>
    <text x="703" y="703" fill="#111b18" font-size="27" font-weight="700">YFinance Source</text>
    <text x="703" y="739" fill="#394640" font-size="23">executes the provider fetch</text>
    <rect x="651" y="769" width="298" height="44" rx="12" fill="#e9efff"/>
    <text x="800" y="797" fill="#1d56c7" font-size="17" font-weight="700" text-anchor="middle">owns provider execution</text>

    <circle cx="1212" cy="708" r="25" fill="#e9eeeb"/>
    <text x="1212" y="716" fill="#111b18" font-size="18" font-weight="700" text-anchor="middle">DU</text>
    <text x="1253" y="703" fill="#111b18" font-size="27" font-weight="700">Data User</text>
    <text x="1253" y="739" fill="#394640" font-size="23">returns the result</text>
    <rect x="1201" y="769" width="298" height="44" rx="12" fill="#edf1ef"/>
    <text x="1350" y="797" fill="#394640" font-size="17" font-weight="700" text-anchor="middle">data · source ID · warnings</text>

    <line x1="430" y1="741" x2="470" y2="741" stroke="#111b18" stroke-width="4"/>
    <rect x="470" y="717" width="110" height="48" rx="24" fill="#111b18"/>
    <text x="525" y="747" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">via Plaza</text>
    <path d="M580 734 H600 V724 L616 741 L600 758 V748 H580 Z" fill="#111b18"/>

    <line x1="980" y1="741" x2="1020" y2="741" stroke="#111b18" stroke-width="4"/>
    <rect x="1020" y="717" width="110" height="48" rx="24" fill="#111b18"/>
    <text x="1075" y="747" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">via Plaza</text>
    <path d="M1130 734 H1150 V724 L1166 741 L1150 758 V748 H1130 Z" fill="#111b18"/>
  </g>
</svg>
